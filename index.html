<script>
const IMAGES={
 hero:'https://www.ifad.org/thefieldreport/media/24865_corrected-mr.jpg',
 maize:'https://media.bcp.earth/uploads/2024/05/Henry-Nkhazi-scaled.jpg?ch=1024&cw=1536&cx=center&cy=center&h=1024&scale.option=fill&w=1536',
 garden:'https://www.undp.org/sites/g/files/zskgke326/files/2025-06/dsc01422_0.jpg',
 harvest:'https://poverty-action.org/sites/default/files/ipa_zambia_maize_checks_c.jpg',
 peppers:'https://seedsforresilience.org/assets/2021/02/Zambia-Catherine-chair-person-of-the-Mambova-Womens-Chili-Group.jpg'
};
const root=document.getElementById('root');
let mem={users:[],fields:[],reports:[],session:null};
function load(){try{const s=localStorage.getItem('agrishield');if(s)return JSON.parse(s)}catch(e){}return mem}
let db=load(),tab='home',mode='login',flt='All';
function save(){mem=db;try{localStorage.setItem('agrishield',JSON.stringify(db))}catch(e){}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hash=s=>{let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return String(h)};
const uid=()=>Math.random().toString(36).slice(2,10);
const val=id=>document.getElementById(id)?.value.trim()??'';
const today=()=>new Date().toISOString().slice(0,10);
const ST=['Pending','Under review','Resolved'],TY=['Drought','Pests','Flood','Disease'];
const me=()=>db.users.find(u=>u.id===db.session);
function setError(t){const e=document.getElementById('error');if(e)e.textContent=t}
function brand(){return `<a class="brand" href="#" onclick="showLanding();return false"><span class="brand-mark">A</span><span>Agrishield Zambia<small>Protecting every harvest</small></span></a>`}
function landing(){
 root.innerHTML=`<header class="site-header"><div class="wrap nav-inner">${brand()}<nav class="nav-links" id="mainNav"><a href="#services">Our services</a><a href="#about">About us</a><a href="#how">How it works</a><a href="#contact">Contact</a></nav><div class="nav-actions"><button class="btn btn-outline" onclick="showAuth('login')">Log in</button><button class="btn btn-yellow" onclick="showAuth('register')">Get started</button><button class="mobile-menu" onclick="document.getElementById('mainNav').classList.toggle('open')">Menu</button></div></div></header>
 <main><section class="hero"><div class="wrap hero-grid"><div class="hero-copy"><div class="eyebrow">For the people who grow Zambia</div><h1>Protect your fields.<br><span style="color:var(--lime)">Protect your future.</span></h1><p>Agrishield gives farmers a simple way to keep field records, report crop damage and follow what happens next. One clear place to keep your farm information organised.</p><div class="hero-ctas"><button class="btn btn-yellow" onclick="showAuth('register')">Create your account</button><button class="btn btn-outline" onclick="showAuth('login')">Farmer sign in</button></div></div><div class="hero-photo"><img src="${IMAGES.hero}" alt="Zambian farmer inspecting maize plants" onerror="this.style.display='none'"><div class="photo-note"><strong>Every field matters.</strong><span>Keep your farm records in one place.</span></div></div></div></section>
 <section class="trust-strip"><div class="wrap trust-inner"><div class="trust-item"><span class="trust-icon"></span> Built around Zambian farmers</div><div class="trust-item"><span class="trust-icon"></span> Simple field records</div><div class="trust-item"><span class="trust-icon"></span> Damage report tracking</div><div class="trust-item"><span class="trust-icon"></span> Clear report status</div></div></section>
 <section class="section" id="services"><div class="wrap"><div class="section-head center"><div class="eyebrow" style="color:var(--forest)">What you can do</div><h2>Practical tools for everyday farming</h2><p>Keep the important details of your farm together and make it easier to communicate when crops are affected.</p></div><div class="services"><article class="service-card"><div class="service-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-9m0 3c-4 0-6-2-6-6 4 0 6 2 6 6Zm0 0c0-4 2-6 6-6 0 4-2 6-6 6Z"/></svg></div><h3>Manage your fields</h3><p>Add each field with its crop and size in hectares. Keep your farm details organised and easy to review.</p></article><article class="service-card"><div class="service-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h10l4 4v12H5Z"/><path d="M8 12h8M8 16h6"/></svg></div><h3>Report crop damage</h3><p>Record drought, pest, flood or disease problems, including severity, date noticed and a clear description.</p></article><article class="service-card"><div class="service-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg></div><h3>Track report progress</h3><p>Return to your report history to see whether a report is pending, under review or resolved.</p></article></div></div></section>
 <section class="section story" id="about"><div class="wrap story-grid"><div class="story-images"><img class="story-main" src="${IMAGES.maize}" alt="Zambian farmer standing in a healthy maize field"><img class="story-small" src="${IMAGES.peppers}" alt="Zambian farmer tending a chilli crop"></div><div class="story-copy"><div class="eyebrow" style="color:var(--forest)">Rooted in local agriculture</div><h2>Supporting the people behind every harvest.</h2><p>From a small family plot to a growing farm, keeping good records can make a difference. Agrishield is designed to make essential farm information easier to record and crop problems easier to follow up.</p><ul class="check-list"><li>Record fields, crops and land size</li><li>Capture the details of crop damage</li><li>Follow report updates from one dashboard</li></ul><button class="btn btn-green" onclick="showAuth('register')">Start using Agrishield</button></div></div></section>
 <section class="section" id="how"><div class="wrap"><div class="section-head center"><div class="eyebrow" style="color:var(--forest)">A straightforward process</div><h2>Three steps. One organised farm record.</h2><p>Get started in a few simple steps. You can return to your dashboard whenever you need it.</p></div><div class="process-grid"><article class="process-card"><div class="step">01</div><h3>Create your account</h3><p>Register with your name, Zambian phone number, district and password.</p></article><article class="process-card"><div class="step">02</div><h3>Add your fields</h3><p>Enter your field names, crops and sizes so each report is linked to the right place.</p></article><article class="process-card"><div class="step">03</div><h3>Submit and follow up</h3><p>Record a crop problem and check its status in your report history.</p></article></div></div></section>
 <section class="cta-band" id="contact"><div class="wrap cta-inner"><div><h2>Keep your farm information close.</h2><p>Set up your Agrishield account and get started today.</p></div><button class="btn btn-yellow" onclick="showAuth('register')">Join Agrishield</button></div></section></main>
 <footer class="site-footer"><div class="wrap footer-inner"><div>${brand()}</div><p>© ${new Date().getFullYear()} Agrishield Zambia. A farmer-focused reporting tool.</p><div class="footer-links"><a href="#services">Services</a><a href="#about">About</a><a href="#contact">Contact</a></div></div></footer>`;
}
function showLanding(){landing()}
function showAuth(m){mode=m;authView()}
function authView(){
 const reg=mode==='register';
 root.innerHTML=`<main class="auth-shell"><section class="auth-panel"><div class="auth-image"><img src="${IMAGES.garden}" alt="Farmer working in a green crop field"><div class="auth-caption"><h2>Good records.<br>Stronger harvests.</h2><p>Keep your fields, crop damage reports and updates together with Agrishield Zambia.</p></div></div><div class="auth-form">${brand()}<h2>${reg?'Create your account':'Welcome back'}</h2><p>${reg?'A few details to get your farm workspace ready.':'Sign in to continue to your Agrishield dashboard.'}</p>${reg?`<label class="field-label">Full name</label><input class="control" id="name" autocomplete="name" placeholder="Your full name">`:''}<label class="field-label">Phone number</label><input class="control" id="phone" inputmode="tel" placeholder="+260971234567" autocomplete="tel" ${reg?'value="+260"':''}>${reg?`<label class="field-label">District</label><input class="control" id="district" placeholder="e.g. Copperbelt">`:''}<label class="field-label">Password</label><input class="control" id="password" type="password" autocomplete="${reg?'new-password':'current-password'}" placeholder="At least 6 characters"><div class="error" id="error"></div><button class="btn btn-yellow" onclick="${reg?'register()':'login()'}">${reg?'Create account':'Sign in'}</button><div class="auth-switch">${reg?'Already registered?':'New to Agrishield?'} <button class="text-btn" onclick="showAuth('${reg?'login':'register'}')">${reg?'Log in':'Create an account'}</button></div><div class="hint">Information is saved in this browser on this device.</div></div></section></main>`;
}
function register(){
 const name=val('name'),ph=val('phone').replace(/\s/g,''),pw=document.getElementById('password').value,d=val('district'),code=val('admincode');
 if(name.length<2)return setError('Enter your full name.');
 if(!/^\+260\d{9}$/.test(ph))return setError('Enter your phone number starting with +260, e.g. +260971234567.');
 if(!d)return setError('Enter your district.');
 if(pw.length<6)return setError('Password must be at least 6 characters.');
 if(db.users.some(u=>u.phone===ph))return setError('That phone number is already registered.');
 if(code&&code!=='ADMIN2026')return setError('Invalid admin code.');
 const u={id:uid(),name,phone:ph,district:d,pw:hash(pw),role:code?'admin':'farmer'};
 db.users.push(u);db.session=u.id;tab='home';save();render();
}
function login(){
 const ph=val('phone').replace(/\s/g,''),pw=document.getElementById('password').value;
 const u=db.users.find(x=>x.phone===ph&&x.pw===hash(pw));
 if(!u)return setError('Phone number or password is incorrect.');
 db.session=u.id;tab='home';save();render();
}
function logout(){db.session=null;tab='home';save();showLanding()}
function go(t){tab=t;render()}
function addField(){
 const name=val('fieldname'),crop=val('crop'),size=parseFloat(val('size'));
 if(!name||!crop)return setError('Field name and crop are required.');
 if(!(size>0&&size<=10000))return setError('Enter a size in hectares greater than 0.');
 db.fields.push({id:uid(),owner:db.session,name,crop,size});save();render();
}
function ask(msg,yes){
 const o=document.createElement('div');
 o.style.cssText='position:fixed;inset:0;background:rgba(7,40,25,.6);display:grid;place-items:center;z-index:9999;padding:20px';
 o.innerHTML='<div role="dialog" aria-modal="true" style="background:#fff;color:#17251b;border-radius:18px;padding:24px;max-width:380px;width:100%;box-shadow:0 18px 50px #0006"><p style="margin:0 0 18px;font-size:16px;font-weight:700"></p><div style="display:flex;gap:10px;justify-content:flex-end"><button type="button" class="btn btn-light" data-n>Cancel</button><button type="button" class="btn" data-y style="background:#b83b35;color:#fff">Delete</button></div></div>';
 o.querySelector('p').textContent=msg;
 o.querySelector('[data-n]').onclick=()=>o.remove();
 o.querySelector('[data-y]').onclick=()=>{o.remove();yes()};
 document.body.appendChild(o);o.querySelector('[data-n]').focus();
}
function delField(id){
 const n=db.reports.filter(r=>r.field===id).length;
 ask(n?'Deleting this field also deletes '+n+' report(s). Continue?':'Delete this field?',()=>{db.fields=db.fields.filter(f=>f.id!==id);db.reports=db.reports.filter(r=>r.field!==id);save();render()});
}
function addReport(){
 const field=val('reportfield'),type=val('problemtype'),sev=+val('severity'),date=val('noticed'),desc=val('description');
 if(!field)return setError('Add a field first, then choose it.');
 if(!date||date>today())return setError('Choose a date that is not in the future.');
 if(desc.length<10)return setError('Describe the problem in at least 10 characters.');
 db.reports.push({id:uid(),field,owner:db.session,type,sev,date,desc,status:'Pending'});save();tab='history';render();
}
function setStatus(id,s){const r=db.reports.find(x=>x.id===id);if(r){r.status=s;save();render()}}
function delReport(id){const r=db.reports.find(x=>x.id===id);if(!r)return;ask('Delete this report? This cannot be undone.',()=>{db.reports=db.reports.filter(x=>x.id!==id);save();render()});}
const fld=id=>db.fields.find(f=>f.id===id),own=id=>db.users.find(u=>u.id===id);
function statusClass(s){return s==='Resolved'?'resolved':s==='Under review'?'review':''}
function statusPill(s){return `<span class="status ${statusClass(s)}">${esc(s)}</span>`}
function reportCard(r,admin){
 const f=fld(r.field)||{name:'Removed field',crop:''},o=own(r.owner)||{name:'Unknown',district:''};
 return `<article class="report-card"><div class="report-card-top"><div><h3>${esc(r.type)} · Severity ${r.sev}/5</h3><div class="report-meta">${esc(r.date)} &nbsp;·&nbsp; ${esc(f.name)}${f.crop?' ('+esc(f.crop)+')':''}${admin?' &nbsp;·&nbsp; '+esc(o.name)+' / '+esc(o.district):''}</div></div>${statusPill(r.status)}</div><p>${esc(r.desc)}</p>${admin?`<label class="field-label">Update report status</label><select class="admin-select" onchange="setStatus('${r.id}',this.value)">${ST.map(s=>`<option${s===r.status?' selected':''}>${s}</option>`).join('')}</select>`:''}<button class="small-btn danger" onclick="delReport('${r.id}')" style="margin-top:10px">Delete report</button></article>`;
}
function stat(label,num,icon){return `<div class="stat-card"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-number">${num}</div></div>`}
function farmerContent(u){
 const F=db.fields.filter(f=>f.owner===u.id),R=db.reports.filter(r=>r.owner===u.id).sort((a,b)=>b.date.localeCompare(a.date));
 if(tab==='fields')return `<section class="panel"><div class="panel-head"><h2>Add a field</h2><span class="muted">Farm records</span></div><div class="form-grid"><div><label class="field-label">Field name</label><input class="control" id="fieldname" placeholder="e.g. North Field"></div><div><label class="field-label">Crop</label><input class="control" id="crop" placeholder="e.g. Maize"></div><div><label class="field-label">Size (hectares)</label><input class="control" id="size" type="number" step="0.1" min="0" placeholder="e.g. 2.5"></div></div><div class="error" id="error"></div><div class="form-actions"><button class="btn btn-green" onclick="addField()">Save field +</button></div></section><section class="panel"><div class="panel-head"><h2>Your fields</h2><span class="muted">${F.length} registered</span></div>${F.length?`<div class="table-wrap"><table><thead><tr><th>Field</th><th>Crop</th><th>Size</th><th>Action</th></tr></thead><tbody>${F.map(f=>`<tr><td><b>${esc(f.name)}</b></td><td>${esc(f.crop)}</td><td>${f.size} ha</td><td><button class="small-btn danger" onclick="delField('${f.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No fields have been added yet.</div>'}</section>`;
 if(tab==='report')return `<section class="panel"><div class="panel-head"><h2>Submit a damage report</h2><span class="muted">Crop incident details</span></div>${F.length?`<div class="form-grid"><div class="full"><label class="field-label">Affected field</label><select class="control" id="reportfield">${F.map(f=>`<option value="${f.id}">${esc(f.name)} (${esc(f.crop)})</option>`).join('')}</select></div><div><label class="field-label">Problem type</label><select class="control" id="problemtype">${TY.map(t=>`<option>${t}</option>`).join('')}</select></div><div><label class="field-label">Severity (1 mild – 5 severe)</label><select class="control" id="severity">${[1,2,3,4,5].map(n=>`<option>${n}</option>`).join('')}</select></div><div><label class="field-label">Date noticed</label><input class="control" id="noticed" type="date" max="${today()}" value="${today()}"></div><div class="full"><label class="field-label">Describe the problem</label><textarea class="control" id="description" rows="4" placeholder="Explain what happened, which crops are affected and any visible damage..."></textarea></div></div><div class="error" id="error"></div><button class="btn btn-green" onclick="addReport()">Submit report</button>`:'<div class="empty">Add a field before submitting a report.<br><button class="btn btn-green" onclick="go(\'fields\')">Add a field</button></div>'}</section>`;
 if(tab==='history')return `<section class="panel"><div class="panel-head"><h2>Report history</h2><span class="muted">${R.length} total reports</span></div>${R.length?R.map(r=>reportCard(r,false)).join(''):'<div class="empty">You have not submitted any damage reports yet.</div>'}</section>`;
 return `<section class="stat-grid">${stat('Registered fields',F.length,'')}${stat('Damage reports',R.length,'')}${stat('Pending reports',R.filter(r=>r.status==='Pending').length,'')}${stat('Resolved reports',R.filter(r=>r.status==='Resolved').length,'')}</section><section class="panel"><div class="panel-head"><h2>Recent damage reports</h2><button class="small-btn" onclick="go('history')">View all</button></div>${R.length?R.slice(0,3).map(r=>reportCard(r,false)).join(''):'<div class="empty">Your recent reports will appear here once submitted.</div>'}</section><section class="panel"><div class="panel-head"><h2>Your farm at a glance</h2><button class="small-btn" onclick="go('fields')">Manage fields</button></div>${F.length?`<div class="table-wrap"><table><thead><tr><th>Field</th><th>Crop</th><th>Area</th></tr></thead><tbody>${F.slice(0,5).map(f=>`<tr><td><b>${esc(f.name)}</b></td><td>${esc(f.crop)}</td><td>${f.size} ha</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Add your first field to start building your farm record.</div>'}</section>`;
}
function adminContent(){
 const R=db.reports.slice().sort((a,b)=>b.date.localeCompare(a.date)),avg=R.length?(R.reduce((a,r)=>a+r.sev,0)/R.length).toFixed(1):'0';
 if(tab==='all'){const L=flt==='All'?R:R.filter(r=>r.status===flt);return `<section class="panel"><div class="panel-head"><div><h2>All damage reports</h2><span class="muted">${L.length} reports shown</span></div><select class="control filter" onchange="flt=this.value;render()">${['All',...ST].map(s=>`<option${s===flt?' selected':''}>${s}</option>`).join('')}</select></div>${L.length?L.map(r=>reportCard(r,true)).join(''):'<div class="empty">No reports match this status.</div>'}</section>`}
 return `<section class="stat-grid">${stat('Registered farmers',db.users.filter(u=>u.role==='farmer').length,'')}${stat('Total reports',R.length,'')}${stat('Pending',R.filter(r=>r.status==='Pending').length,'')}${stat('Average severity',avg+'/5','')}</section><section class="panel"><div class="panel-head"><h2>Report status overview</h2><button class="small-btn" onclick="go('all')">Manage reports</button></div>${ST.map(s=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid #edf0eb"><span>${statusPill(s)}</span><b style="color:var(--forest)">${R.filter(r=>r.status===s).length}</b></div>`).join('')}</section><section class="panel"><div class="panel-head"><h2>Reports by problem type</h2></div>${TY.map(t=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #edf0eb;font-size:13px"><span>${t}</span><b>${R.filter(r=>r.type===t).length}</b></div>`).join('')}</section>`;
}
function render(){
 const u=me();if(!u){landing();return}
 const admin=u.role==='admin',tabs=admin?[['home','Overview'],['all','All reports']]:[['home','Overview'],['fields','My fields'],['report','Report damage'],['history','Report history']];
 if(!tabs.some(t=>t[0]===tab))tab='home';
 root.innerHTML=`<div class="app-shell"><header class="app-top"><div class="wrap app-top-inner"><div class="app-user"><div class="avatar">${esc((u.name||'A').charAt(0).toUpperCase())}</div><div><strong>${esc(u.name)}</strong><small>${admin?'Agrishield administrator':esc(u.district)+' district · Farmer account'}</small></div></div><div style="display:flex;gap:9px;align-items:center"><button class="btn btn-outline" onclick="showLanding()" style="min-height:38px;padding:8px 14px;font-size:11px">Website</button><button class="btn btn-yellow" onclick="logout()" style="min-height:38px;padding:8px 14px;font-size:11px">Log out</button></div></div></header><div class="app-nav-wrap"><nav class="wrap app-nav">${tabs.map(t=>`<button class="tab-btn ${tab===t[0]?'active':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}</nav></div><main class="wrap app-main"><section class="welcome"><div><div class="eyebrow">Your Agrishield workspace</div><h1>${admin?'Admin overview':'Good to have you here, '+esc(u.name.split(' ')[0])+'.'}</h1><p>${admin?'Review farmer reports and keep track of their progress.':'Your farm records and crop damage updates, all in one place.'}</p></div>${!admin?`<button class="btn btn-yellow" onclick="go('report')">+ New damage report</button>`:`<button class="btn btn-yellow" onclick="go('all')">Review reports</button>`}</section>${admin?adminContent():farmerContent(u)}</main><footer class="app-footer"><div class="wrap">Agrishield Zambia · Keep your farm information organised.</div></footer></div>`;
}
if(me())render();else landing();
</script>
</body>
</html>
